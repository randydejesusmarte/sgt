name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}   # te permite lanzarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java (requerido por Gradle/Android)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Actualizar dependencias (pub upgrade)
        run: flutter pub upgrade

      - name: Obtener dependencias
        run: flutter pub get

      - name: Analizar código (opcional, no rompe el build si falla)
        run: flutter analyze || true

      - name: Compilar APK (release)
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7   # se borra automáticamente pasados 7 días
